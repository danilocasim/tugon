name: Verify Tugon
on: [push, pull_request]
permissions:
  contents: read

jobs:
  app-and-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run lint && npm --prefix apps/web run typecheck && npm --prefix apps/web run test
      - run: supabase start --exclude studio,postgres-meta,edge-runtime,imgproxy
      - run: supabase test db
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - run: docker build -t tugon-web:ci apps/web
      - name: Verify the release image in Chromium
        env:
          TUGON_TEST_ORIGIN: http://localhost:3100
          TUGON_TEST_PRODUCTION: "1"
        run: |
          node ops/with-local-supabase.mjs docker run --detach --rm --name tugon-web-ci --network host \
            -e PORT=3100 -e TUGON_ORIGIN \
            -e SUPABASE_URL -e SUPABASE_PUBLISHABLE_KEY -e SUPABASE_SERVICE_KEY \
            -e TUGON_SETUP_SECRET -e TUGON_JOBS_SECRET \
            -e TUGON_LIVE_DELIVERY -e TUGON_EMAIL_DELIVERY -e TUGON_SMS_DELIVERY \
            -e TUGON_AUTH_SMS_ENABLED -e TUGON_RETENTION_JOBS -e TUGON_EVIDENCE_GC \
            tugon-web:ci
          trap 'docker stop tugon-web-ci >/dev/null' EXIT
          curl --fail --silent --show-error --max-time 3 --retry 15 --retry-all-errors \
            --retry-max-time 45 http://localhost:3100/api/health/ready
          node ops/with-local-supabase.mjs npm --prefix apps/web run test:e2e
